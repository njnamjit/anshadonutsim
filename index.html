<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Legends: Z-A - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif !important;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden bg-slate-950">

    <!-- พื้นหลังแบบดรอปแสงและเบลอ เพื่อให้ตัวละครเด่นขึ้น -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <img src="bg.png" alt="Background" class="w-full h-full object-cover brightness-75 blur-[2px] scale-105">
        <!-- เลเยอร์สีดำบางๆ ช่วยทับให้พื้นหลังไม่สว่างเกินไป -->
        <div class="absolute inset-0 bg-black/25"></div>
    </div>

    <!-- Header ข้างบน -->
    <header class="relative z-10">
    </header>

    <!-- Main Content (พื้นที่ตรงกลางหน้าจอ) -->
    <main class="flex-1 flex items-center justify-center p-4 relative z-10 my-auto">
        <!-- รูปตรงกลางหน้าจอ -->
        <div class="w-full flex justify-center items-center">
            <img src="logo.png" alt="Center Display" class="w-full max-w-[800px] max-h-[70vh] object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.6)]">
        </div>
    </main>

    <!-- รูปมุมซ้ายล่าง (ใส่ drop-shadow เพิ่มความมิติ) -->
    <div class="fixed bottom-0 left-0 z-10 pointer-events-none max-w-[40vw] md:max-w-[30vw]">
        <img src="ansha.png" alt="Bottom Left Display" class="h-[45vh] md:h-[55vh] w-auto object-contain object-bottom drop-shadow-[0_8px_16px_rgba(0,0,0,0.6)]">
    </div>
	
    <!-- รูปมุมขวาล่าง (ใส่ drop-shadow เพิ่มความมิติ) -->
    <div class="fixed bottom-0 right-0 z-10 pointer-events-none max-w-[40vw] md:max-w-[30vw]">
        <img src="hoopa.png" alt="Bottom Right Display" class="h-[45vh] md:h-[55vh] w-auto object-contain object-bottom drop-shadow-[0_8px_16px_rgba(0,0,0,0.6)]">
    </div>

    <!-- ปุ่มกด 3 ปุ่ม ด้านล่างตรงกลางหน้าจอ -->
    <footer class="sticky bottom-6 z-20 flex justify-center items-center w-full px-4 mt-auto">
        <div class="flex items-center gap-2 sm:gap-4 bg-slate-900/80 backdrop-blur-md p-2 sm:p-3 rounded-2xl border border-slate-700/80 shadow-2xl">
            <a href="index.html" class="px-4 py-2.5 rounded-xl text-sm md:text-base font-semibold text-slate-900 bg-amber-400 hover:bg-amber-300 transition flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-house"></i> หน้าแรก
            </a>
            <a href="donuts.html" class="px-4 py-2.5 rounded-xl text-sm md:text-base font-semibold text-slate-200 bg-slate-800/80 hover:bg-slate-700 hover:text-white transition flex items-center gap-2 border border-slate-700">
                <i class="fa-solid fa-circle-dot text-pink-400"></i> โดนัท
            </a>
            <a href="simulator.html" class="px-4 py-2.5 rounded-xl text-sm md:text-base font-semibold text-slate-200 bg-slate-800/80 hover:bg-slate-700 hover:text-white transition flex items-center gap-2 border border-slate-700">
                <i class="fa-solid fa-flask text-sky-400"></i> ลองทำ
            </a>
        </div>
    </footer>

</body>
</html>
